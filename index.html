<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Em - Món Quà 20/10</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0312;
            background: radial-gradient(circle at center, #1f0933 0%, #0a0312 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            user-select: none;
            -webkit-touch-callout: none; 
        }

        /* --- LỚP ICON BAY LƠ LỬNG --- */
        #emoji-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 2; overflow: hidden;
        }
        .floating-icon {
            position: absolute; bottom: -50px;
            animation: floatUp linear forwards;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* --- MÀN HÌNH BẮT ĐẦU (NÚT TRÒN GIỮ 2S) --- */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 3, 18, 0.95); z-index: 999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1s ease;
        }
        #start-screen.hidden { opacity: 0; pointer-events: none; }

        .start-btn {
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle at top left, #ffb3c6, #ff4d6d);
            color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 1px;
            border: 2px solid #fff; box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            position: relative; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s;
        }

        .start-btn:active { transform: scale(0.95); }

        .start-btn::before {
            content: ''; position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4);
            z-index: 1; transform: translateY(100%);
            transition: transform 0s;
        }

        .start-btn.holding::before {
            transform: translateY(0);
            transition: transform 2s linear;
        }

        .start-btn span {
            position: relative; z-index: 2; text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(255, 77, 109, 0.6); }
            50% { box-shadow: 0 0 40px rgba(255, 77, 109, 0.9); }
            100% { box-shadow: 0 0 20px rgba(255, 77, 109, 0.6); }
        }
        .start-btn { animation: pulseGlow 2s infinite; }

        /* --- CANVAS HOA & BỤI SAO --- */
        #canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; transition: opacity 2s ease-in-out; opacity: 0;
        }

        /* --- MÈO NUNA CHẠY TỰ DO --- */
        #running-cat {
            position: fixed; top: 50%; left: 50%;
            z-index: 100; cursor: grab;
            transition: transform 1.5s ease-in-out, top 1.5s ease-in-out, left 1.5s ease-in-out;
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(255, 121, 198, 0.8));
            touch-action: none; /* Ngăn cuộn trang khi kéo mèo trên mobile */
        }
        #running-cat.show { opacity: 1; pointer-events: auto; }
        #running-cat:active { cursor: grabbing; }
        #running-cat svg { width: 70px; height: 70px; pointer-events: none; } /* Cho phép kéo từ mọi điểm trên mèo */

        /* Bong bóng chat */
        .cat-bubble {
            background: #fff; color: #d90429;
            padding: 10px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 600; white-space: normal; text-align: center; width: max-content; max-width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: absolute; bottom: 85px;
            opacity: 0; transform: scale(0);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center; pointer-events: none;
            border: 2px solid #ffb3c6;
        }
        .cat-bubble::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%); border-width: 8px 8px 0;
            border-style: solid; border-color: #fff transparent transparent transparent;
        }
        .cat-bubble.show { opacity: 1; transform: scale(1); }

        /* --- KHUNG THIỆP KÍNH HÌNH CHỮ NHẬT --- */
        .letter {
            position: fixed; 
            top: 50%; left: 50%;
            transform: translate(-50%, -40%) scale(0.8); 
            width: 90vw; 
            max-width: 800px;
            aspect-ratio: 16 / 9; 
            background: rgba(15, 5, 25, 0.85); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 150, 200, 0.3);
            border-radius: 20px;
            z-index: 5;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 105, 180, 0.1);
            display: flex; 
            flex-direction: row-reverse; 
            gap: 30px;
            align-items: center;
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; pointer-events: none;
            overflow: hidden;
        }

        /* Hào quang thiệp */
        .letter::before {
            content: ''; position: absolute; inset: -5px; border-radius: 25px;
            background: linear-gradient(45deg, rgba(255,105,180,0.6), transparent, rgba(0,180,255,0.6), transparent);
            background-size: 300% 300%;
            z-index: -1; filter: blur(15px);
            animation: aurora 5s ease infinite;
        }
        @keyframes aurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .letter.show {
            opacity: 1; pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        /* --- CỘT TRÁI: CÂU CHÚC --- */
        .content-panel {
            flex: 1.3; 
            display: flex; flex-direction: column; 
            text-align: left; position: relative; height: 100%; justify-content: center;
        }

        .message { 
            font-size: 14px; color: #f8f9fa; line-height: 1.6; 
            font-weight: 400; white-space: pre-line; 
            text-shadow: 0 1px 3px rgba(0,0,0,0.9); 
            margin-bottom: 15px;
        }
        .signature { 
            font-family: 'Dancing Script', cursive; color: #ff79c6; 
            font-size: 22px; margin-top: auto; align-self: flex-end; min-height: 25px;
            text-shadow: 0 0 8px rgba(255,121,198,0.6);
        }

        /* --- NÚT FACEBOOK --- */
        .fb-btn {
            display: inline-block;
            margin-top: 10px;
            margin-left: 5px;
            align-self: flex-end;
            padding: 6px 16px;
            background: rgba(255, 105, 180, 0.15);
            border: 1px solid #ff79c6;
            color: #ff79c6;
            text-decoration: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255, 121, 198, 0.3);
            cursor: pointer;
            z-index: 10;
        }
        .fb-btn:hover {
            background: #ff79c6;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 121, 198, 0.6);
            transform: scale(1.05);
        }

        /* --- CỘT PHẢI: LỊCH --- */
        .calendar-wrapper {
            flex: 1;
            background: rgba(255, 182, 193, 0.1);
            border: 1px solid rgba(255, 150, 200, 0.4);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(255, 150, 200, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .calendar-wrapper::after {
            content: ''; position: absolute; inset: 0; border-radius: 15px;
            box-shadow: 0 0 15px #ff79c6, 0 0 30px #ff79c6 inset;
            opacity: 0.2; pointer-events: none;
        }

        .calendar-title {
            text-align: center; font-family: 'Dancing Script', cursive;
            color: #ff79c6; font-size: 24px; font-weight: bold; margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,121,198,0.5);
        }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 6px; text-align: center; font-size: 11px; color: #e0aaff;
        }

        .calendar-grid .day-name { font-weight: 600; color: #ffb3c6; margin-bottom: 4px; }
        .calendar-grid .date { padding: 3px 0; border-radius: 5px; position: relative; }
        
        .calendar-grid .date.highlight {
            background: rgba(255, 77, 109, 0.9); color: #fff;
            font-weight: bold; box-shadow: 0 0 10px #ff4d6d;
            animation: pulseDate 1.5s infinite alternate;
        }
        .calendar-grid .date.highlight::after {
            content: '❤️'; position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            font-size: 10px; opacity: 0;
        }
        .letter.show .calendar-grid .date.highlight::after { opacity: 1; transition-delay: 1.5s; }
        @keyframes pulseDate { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        /* Nút nhạc */
        .music-control {
            position: absolute; top: 20px; right: 20px; width: 45px; height: 45px;
            background: rgba(255,255,255,0.1); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; cursor: pointer; z-index: 10;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
            transition: 0.3s; opacity: 0; pointer-events: none;
        }
        .music-control.show { opacity: 1; pointer-events: auto; }
        .music-control.playing svg { animation: bounce 1s infinite alternate; }
        @keyframes bounce { to { transform: translateY(-5px); } }

        /* --- ĐIỆN THOẠI --- */
        @media (max-width: 768px) {
            .letter { 
                width: 95vw; 
                aspect-ratio: 4 / 3; 
                padding: 15px; 
                flex-direction: row; 
                gap: 10px;
            }
            .content-panel { flex: 1.3; }
            .calendar-wrapper { flex: 1; padding: 8px; }
            
            .calendar-title { font-size: 16px; margin-bottom: 5px; }
            .calendar-grid { font-size: 8px; gap: 2px; }
            .calendar-grid .date { padding: 2px 0; }
            
            .message { font-size: 10px; line-height: 1.4; margin-bottom: 5px; }
            .signature { font-size: 16px; }
            .fb-btn { font-size: 10px; padding: 4px 10px; margin-top: 5px; }
        }
    </style>
</head>
<body>
    <div id="emoji-bg"></div>
    
    <!-- IFRAME YOUTUBE (Nạp sẵn ở chế độ Mute) -->
    <iframe id="bg-music" 
            style="display:none;" 
            src="https://www.youtube.com/embed/07U4H4m6rQc?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=07U4H4m6rQc&controls=0" 
            allow="autoplay; encrypted-media">
    </iframe>
    
    <canvas id="canvas"></canvas>

    <!-- CHÚ MÈO NUNA -->
    <div id="running-cat">
        <div class="cat-bubble" id="cat-bubble">...</div>
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffb6c1" stop-opacity="1" />
                    <stop offset="100%" stop-color="#ff69b4" stop-opacity="1" />
                </radialGradient>
            </defs>
            <path d="M25 40 L15 10 L45 25 Z" fill="#ffb6c1" />
            <path d="M75 40 L85 10 L55 25 Z" fill="#ffb6c1" />
            <path d="M10 70 Q0 80 15 90 Q25 95 25 85" stroke="#ffb6c1" stroke-width="6" fill="none" stroke-linecap="round"/>
            <circle cx="50" cy="55" r="35" fill="url(#pinkGlow)" />
            <polygon points="50,5 53,15 63,15 55,22 58,32 50,26 42,32 45,22 37,15 47,15" fill="#ffd700" />
            <circle cx="35" cy="50" r="7" fill="#000" />
            <circle cx="37" cy="48" r="2.5" fill="#fff" />
            <circle cx="33" cy="52" r="1" fill="#fff" />
            <circle cx="65" cy="50" r="7" fill="#000" />
            <circle cx="67" cy="48" r="2.5" fill="#fff" />
            <circle cx="63" cy="52" r="1" fill="#fff" />
            <path d="M45 60 Q 47.5 63 50 60 Q 52.5 63 55 60" stroke="#000" stroke-width="2" fill="none" stroke-linecap="round"/>
            <circle cx="25" cy="60" r="5" fill="#ff69b4" opacity="0.5" />
            <circle cx="75" cy="60" r="5" fill="#ff69b4" opacity="0.5" />
        </svg>
    </div>

    <div id="start-screen">
        <button id="start-btn" class="start-btn">
            <span>Mở Quà</span>
        </button>
    </div>

    <div id="music-btn" class="music-control">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
    </div>

    <!-- KHUNG THIỆP -->
    <div class="letter" id="letter">
        <div class="content-panel">
            <p class="message" id="type-msg"></p>
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
                <p class="signature" id="type-sig"></p>
                <a href="https://www.facebook.com/share/1F9VxP4LhV/?mibextid=wwXIfr" target="_blank" class="fb-btn">
                    Bấm vào đây
                </a>
            </div>
        </div>

        <div class="calendar-wrapper">
            <div class="calendar-title">❤️ Tháng 10 ❤️</div>
            <div class="calendar-grid">
                <div class="day-name">T2</div><div class="day-name">T3</div><div class="day-name">T4</div><div class="day-name">T5</div><div class="day-name">T6</div><div class="day-name">T7</div><div class="day-name">CN</div>
                <div></div><div></div><div></div><div class="date">1</div><div class="date">2</div><div class="date">3</div><div class="date">4</div>
                <div class="date">5</div><div class="date">6</div><div class="date">7</div><div class="date">8</div><div class="date">9</div><div class="date">10</div><div class="date">11</div>
                <div class="date">12</div><div class="date">13</div><div class="date">14</div><div class="date">15</div><div class="date">16</div><div class="date">17</div><div class="date">18</div>
                <div class="date">19</div><div class="date highlight">20</div><div class="date">21</div><div class="date">22</div><div class="date">23</div><div class="date">24</div><div class="date">25</div>
                <div class="date">26</div><div class="date">27</div><div class="date">28</div><div class="date">29</div><div class="date">30</div><div class="date">31</div><div></div>
            </div>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const letter = document.getElementById('letter');
        const musicBtn = document.getElementById('music-btn');
        const bgMusic = document.getElementById('bg-music');
        const canvas = document.getElementById('canvas');
        const runningCat = document.getElementById('running-cat');
        const catBubble = document.getElementById('cat-bubble');
        const emojiBg = document.getElementById('emoji-bg');
        
        let isOpened = false;
        let animationStarted = false;
        let isMusicPlaying = true; 

        // ================== HÀM ĐIỀU KHIỂN YOUTUBE ==================
        function postYTCommand(func) {
            bgMusic.contentWindow.postMessage(JSON.stringify({
                event: 'command',
                func: func,
                args: []
            }), '*');
        }

        // ================== LOGIC NHẤN GIỮ 2 GIÂY ==================
        let pressTimer;
        
        function startHold(e) {
            e.preventDefault(); 
            startBtn.classList.add('holding'); 
            
            postYTCommand('unMute');
            postYTCommand('playVideo');
            
            pressTimer = setTimeout(() => {
                startBtn.classList.remove('holding');
                startScreen.classList.add('hidden');
                canvas.style.opacity = '1';
                musicBtn.classList.add('playing');
                animationStarted = true;
            }, 2000); 
        }

        function cancelHold(e) {
            clearTimeout(pressTimer); 
            startBtn.classList.remove('holding');
            if (!animationStarted) { postYTCommand('mute'); }
        }

        startBtn.addEventListener('mousedown', startHold);
        startBtn.addEventListener('touchstart', startHold, {passive: false});
        startBtn.addEventListener('mouseup', cancelHold);
        startBtn.addEventListener('mouseleave', cancelHold);
        startBtn.addEventListener('touchend', cancelHold);
        startBtn.addEventListener('touchcancel', cancelHold);

        // ================== NÚT BẬT/TẮT NHẠC ==================
        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (isMusicPlaying) {
                postYTCommand('mute');
                musicBtn.classList.remove('playing');
                isMusicPlaying = false;
            } else {
                postYTCommand('unMute');
                postYTCommand('playVideo');
                musicBtn.classList.add('playing');
                isMusicPlaying = true;
            }
        });

        // ================== HIỆU ỨNG ICON BAY NỀN ==================
        const emojis = ['💐', '🌸', '🌹', '🌺', '🌻', '🌷', '🎁', '🧧', '💝'];
        function spawnEmoji() {
            if (!animationStarted) return;
            const span = document.createElement('span');
            span.className = 'floating-icon';
            span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            const size = Math.random() * 20 + 15;
            span.style.fontSize = size + 'px';
            span.style.left = Math.random() * 100 + 'vw';
            const duration = Math.random() * 6 + 6;
            span.style.animationDuration = duration + 's';
            emojiBg.appendChild(span);
            setTimeout(() => { span.remove(); }, duration * 1000);
        }
        setInterval(spawnEmoji, 300);

        // ================== HIỆU ỨNG ĐÁNH MÁY ==================
        const msgEl = document.getElementById('type-msg');
        const sigEl = document.getElementById('type-sig');

        function typeText(element, text, index, speed, callback) {
            if (index < text.length) {
                element.textContent += text.charAt(index);
                setTimeout(() => typeText(element, text, index + 1, speed, callback), speed);
            } else {
                if (callback) callback();
            }
        }

        function startTyping() {
            msgEl.textContent = ''; sigEl.textContent = '';
            let messageText = "Gửi đến cô gái xinh đẹp đang đọc thư!\nChúc bạn có một ngày 20/10 thật bình yên - nơi có nụ cười, hoa, và cả những lời yêu thương ngọt ngào nhất.\nChúc bạn luôn là chính mình, luôn đủ mạnh mẽ để bước qua mọi giông bão, và vẫn dịu dàng như những ngày đầu.\nDù thế giới có ồn ào, mong bạn vẫn giữ được trái tim trong trẻo, niềm tin vẹn nguyên và sự tự tin rằng:\nBẠN XỨNG ĐÁNG VỚI NHỮNG ĐIỀU TỐT ĐẸP NHẤT.💝";
            
            typeText(msgEl, messageText, 0, 30, () => {
                typeText(sigEl, "From: Nghiaxz.dev", 0, 60);
            });
        }

        // ================== MÈO NUNA & KÉO THẢ ==================
        let isDragging = false;
        let offsetX, offsetY;
        let catInterval;

        function moveCat() {
            if (isDragging) return; // Không tự chạy nếu đang bị kéo

            const padding = 70;
            const maxX = window.innerWidth - padding * 2;
            const maxY = window.innerHeight - padding * 2;
            
            const randomX = Math.random() * maxX + padding;
            const randomY = Math.random() * maxY + padding;
            
            runningCat.style.left = randomX + 'px';
            runningCat.style.top = randomY + 'px';

            if (randomX < window.innerWidth / 2) {
                runningCat.querySelector('svg').style.transform = 'scaleX(-1)';
            } else {
                runningCat.querySelector('svg').style.transform = 'scaleX(1)';
            }
        }

        function startDrag(e) {
            e.stopPropagation();
            isDragging = true;
            runningCat.style.transition = 'none'; // Tắt transition để kéo mượt
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = runningCat.getBoundingClientRect();
            
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
        }

        function dragging(e) {
            if (!isDragging) return;
            e.preventDefault(); // Ngăn cuộn trang trên mobile

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            let newX = clientX - offsetX;
            let newY = clientY - offsetY;

            // Giới hạn trong màn hình
            newX = Math.max(10, Math.min(window.innerWidth - 80, newX));
            newY = Math.max(10, Math.min(window.innerHeight - 80, newY));

            runningCat.style.left = newX + 'px';
            runningCat.style.top = newY + 'px';
        }

        function endDrag() {
            if (isDragging) {
                isDragging = false;
                // Bật lại transition để nó tự chạy tiếp
                runningCat.style.transition = 'transform 1.5s ease-in-out, top 1.5s ease-in-out, left 1.5s ease-in-out';
            }
        }

        runningCat.addEventListener('mousedown', startDrag);
        runningCat.addEventListener('touchstart', startDrag, {passive: false});
        
        document.addEventListener('mousemove', dragging);
        document.addEventListener('touchmove', dragging, {passive: false});
        
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchend', endDrag);

        // Bắn tim khi bấm (click)
        runningCat.addEventListener('click', (e) => {
            e.stopPropagation(); 
            const rect = runningCat.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            for(let i = 0; i < 6; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'fixed'; heart.style.left = startX + 'px'; heart.style.top = startY + 'px';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.pointerEvents = 'none'; heart.style.zIndex = '9999';
                heart.style.transition = 'all 1s cubic-bezier(0.25, 1, 0.5, 1)';
                document.body.appendChild(heart);
                
                let destX = startX + (Math.random() - 0.5) * 250;
                let destY = startY - (Math.random() * 150 + 50);
                
                requestAnimationFrame(() => {
                    heart.style.transform = `translate(${destX - startX}px, ${destY - startY}px) scale(${Math.random() * 0.5 + 0.8})`;
                    heart.style.opacity = '0';
                });
                setTimeout(() => heart.remove(), 1000);
            }
        });

        const catMessages = [
            "Xin chào mình là Nuna 💬",
            "Nhận lệnh của daka Nghĩa mang quà đến cho bạn đây 🎁",
            "Ngày 20/10 vui vẻ nha! ❤️",
            "Mãi iu daka Nghĩa 💕",
            "Kéo mình đi chơi đi 🙈"
        ];
        
        let msgIndex = 0;
        function startCatChat() {
            catBubble.textContent = catMessages[msgIndex];
            catBubble.classList.add('show');
            
            setTimeout(() => {
                catBubble.classList.remove('show');
                letter.classList.add('show');
                musicBtn.classList.add('show');
                startTyping();
            }, 4500);

            msgIndex++;

            setTimeout(() => {
                setInterval(() => {
                    catBubble.textContent = catMessages[msgIndex];
                    catBubble.classList.add('show');
                    setTimeout(() => { catBubble.classList.remove('show'); }, 3500);
                    msgIndex = (msgIndex + 1) % catMessages.length;
                }, 6000);
            }, 5000);
        }

        catInterval = setInterval(() => { if(isOpened) moveCat(); }, 3500);

        // ================== VẼ HOA VÀ BỤI SAO ==================
        const ctx = canvas.getContext('2d');
        let width, height; let time = 0; let flowers = []; let spawnRadius = 0; 
        let dust = []; 

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        function drawFluffyPetal(cx, cy, angle, length, widthP, color) {
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
            let gradient = ctx.createLinearGradient(0, 0, 0, length);
            gradient.addColorStop(0, color.in); gradient.addColorStop(1, color.out);
            ctx.fillStyle = gradient;
            ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.bezierCurveTo(widthP, length * 0.2, widthP * 0.8, length * 0.9, 0, length);
            ctx.bezierCurveTo(-widthP * 0.8, length * 0.9, -widthP, length * 0.2, 0, 0);
            ctx.fill(); ctx.restore();
        }

        function drawPeonyFlower(flower) {
            const { x, y, scale, progress, colorType } = flower;
            const palettes = [
                [ {in: '#ffb3c6', out: '#ff8fa3'}, {in: '#ff4d6d', out: '#c9184a'}, {in: '#a4133c', out: '#590d22'} ],
                [ {in: '#e0aaff', out: '#c77dff'}, {in: '#9d4edd', out: '#5a189a'}, {in: '#3c096c', out: '#10002b'} ],
                [ {in: '#ffccd5', out: '#ffb3c6'}, {in: '#ff758f', out: '#c9184a'}, {in: '#800f2f', out: '#590d22'} ],
                [ {in: '#ffffff', out: '#f8f9fa'}, {in: '#ffb3c6', out: '#ff8fa3'}, {in: '#ff4d6d', out: '#c9184a'} ]
            ];
            const colors = palettes[colorType % palettes.length];
            let p1 = Math.min(progress * 3, 1); if(p1 > 0) { for(let i=0; i<9; i++) drawFluffyPetal(x, y, (Math.PI*2/9)*i, 70*scale*p1, 35*scale*p1, colors[0]); }
            let p2 = Math.max(0, Math.min((progress - 0.2) * 3, 1)); if(p2 > 0) { for(let i=0; i<8; i++) drawFluffyPetal(x, y, (Math.PI*2/8)*i + 0.5, 50*scale*p2, 25*scale*p2, colors[1]); }
            let p3 = Math.max(0, Math.min((progress - 0.4) * 3, 1)); if(p3 > 0) { for(let i=0; i<6; i++) drawFluffyPetal(x, y, (Math.PI*2/6)*i + 1, 25*scale*p3, 15*scale*p3, colors[2]); ctx.beginPath(); ctx.arc(x, y, 8*scale*p3, 0, Math.PI*2); ctx.fillStyle = '#ffea00'; ctx.fill(); }
        }

        function createDust() {
            if(dust.length < 60) {
                dust.push({
                    x: Math.random() * width,
                    y: height + 10,
                    size: Math.random() * 2 + 1,
                    speedY: Math.random() * 1 + 0.5,
                    speedX: (Math.random() - 0.5) * 0.5,
                    alpha: Math.random(),
                    color: Math.random() > 0.5 ? '#ffb3c6' : '#e0aaff'
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate); if (!animationStarted) return;
            
            ctx.fillStyle = 'rgba(10, 3, 18, 0.3)'; ctx.fillRect(0, 0, width, height); time++;

            createDust();
            dust.forEach((d, index) => {
                d.y -= d.speedY;
                d.x += d.speedX;
                d.alpha -= 0.002;
                
                ctx.globalAlpha = d.alpha;
                ctx.fillStyle = d.color;
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                if(d.y < -10 || d.alpha <= 0) dust.splice(index, 1);
            });

            if (time > 10 && time < 250 && flowers.length < 150) {
                spawnRadius += 4.5; let numSpawn = Math.random() > 0.5 ? 2 : 3; 
                for(let i=0; i<numSpawn; i++) {
                    let angle = Math.random() * Math.PI * 2; 
                    let rx = width/2 + Math.cos(angle) * spawnRadius; let ry = height/2 + Math.sin(angle) * spawnRadius;
                    if (rx > -100 && rx < width + 100 && ry > -100 && ry < height + 100) {
                        flowers.push({ x: rx, y: ry, scale: Math.random() * 1.2 + 0.6, progress: 0, colorType: Math.floor(Math.random() * 4) });
                    }
                }
            }
            flowers.forEach(f => { if (f.progress < 1) f.progress += 0.05; drawPeonyFlower(f); });

            if (time === 250 && !isOpened) {
                isOpened = true;
                runningCat.classList.add('show'); 
                moveCat();
                startCatChat(); 
            }
        }
        animate();
    </script>
</body>
</html>
